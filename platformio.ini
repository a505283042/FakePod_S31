; FakePod S31（ESP32-S31 / CO5300 460x460 / AXP2101 / CS43131）
;
; 说明：
; - 本机 PlatformIO 官方 espressif32@8.0.0 尚未内置 esp32s31，因此使用
;   platform/ 下的本地平台副本（仅增加 esp32s31/RISC-V 支持）。
; - ESP-IDF 6.1.0（framework-espidf 4.60100.0）+ riscv32 工具链 15.2.0。

[platformio]
default_envs = fakepod_s31

[env:fakepod_s31]
platform = symlink://./platform/espressif32_s31
board = fakepod_s31
framework = espidf
board_upload.flash_size = 16MB
board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_build.f_cpu = 320000000L
board_build.partitions = partitions.csv
; Use a distinct config for the A2DP branch, so the old BLE-only generated sdkconfig
; cannot silently mask CONFIG_BT_CLASSIC_ENABLED / CONFIG_BT_A2DP_ENABLE.
; Original sdkconfig.fakepod_s31 stays untouched for switching back to main.
board_build.esp-idf.sdkconfig_path = sdkconfig.fakepod_s31_bt_dma
board_build.cmake_extra_args =
	-DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.bluetooth.defaults"
upload_speed = 921600
monitor_speed = 115200
; APP_DIAG_PROFILE: 0=RELEASE, 1=DEBUG, 2=STRESS
; IDF 6.1 默认打开 -Werror；GCC 15 新增的 class-memaccess 会对
; 带默认成员初始值的 POD 结构体 memset 报错，这里只降级该告警。
build_flags =
	-DAPP_DIAG_PROFILE=0
	-Wno-error=class-memaccess
	-Wno-error=stringop-truncation
monitor_filters =
	esp32_exception_decoder
	time
platform_packages =
	platformio/framework-espidf@4.60100.0
	platformio/toolchain-riscv32-esp@15.2.0+20251204

; SBC-only production build: internal ESP-IDF SBC for A2DP Source and Sink.
; AVRCP, BLE Remote, and Source/Receive switching remain available.
